databaseChangeLog:
  - changeSet:
      id: "1772740872039-1"
      author: "sqgolliaf"
      changes:
        - createTable:
            tableName: "t_dql_event"
            columns:
              - column:
                  name: "event_id"
                  type: "varchar(36)"
                  constraints:
                    primaryKey: true
              - column:
                  name: "saga_id"
                  type: "varchar(36)"
              - column:
                  name: "original_topic"
                  type: "varchar(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "original_message"
                  type: "text"
                  constraints:
                    nullable: false
              - column:
                  name: "error_message"
                  type: "text"
              - column:
                  name: "error_trace"
                  type: "text"
              - column:
                  name: "retry_count"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "is_resolved"
                  type: "boolean"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamptz"
                  constraints:
                    nullable: false
              - column:
                  name: "last_retry_at"
                  type: "timestamptz"
              - column:
                  name: "resolved_at"
                  type: "timestamptz"
        - createTable:
            tableName: "t_order"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "saga_id"
                  type: "varchar(36)"
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: "name"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "quantity"
                  type: "integer"
                  constraints:
                    nullable: false
              - column:
                  name: "price"
                  type: "numeric(19,2)"
                  constraints:
                    nullable: false
              - column:
                  name: "status"
                  type: "varchar(50)"
                  constraints:
                    nullable: false
              - column:
                  name: "delivery_request_id"
                  type: "varchar(36)"
              - column:
                  name: "created_at"
                  type: "timestamptz"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamptz"
                  constraints:
                    nullable: false
        - createTable:
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "id"
                  type: "uuid"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "order_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "event_type"
                  type: "varchar(50)"
                  constraints:
                    nullable: false
              - column:
                  name: "status"
                  type: "varchar(20)"
                  constraints:
                    nullable: false
              - column:
                  name: "payload"
                  type: "text"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamptz"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamptz"
                  constraints:
                    nullable: false
              - column:
                  name: "retry_count"
                  type: "integer"
                  constraints:
                    nullable: false
              - column:
                  name: "next_retry_at"
                  type: "timestamptz"
              - column:
                  name: "error_message"
                  type: "varchar(500)"
              - column:
                  name: "partition_key"
                  type: "varchar(255)"
              - column:
                  name: "topic"
                  type: "varchar(100)"
                  constraints:
                    nullable: false
        - createSequence:
            sequenceName: "order_seq"
            startValue: 1
            incrementBy: 1
        - createIndex:
            indexName: "idx_outbox_status"
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "status"
        - createIndex:
            indexName: "idx_outbox_next_retry_at"
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "next_retry_at"
        - createIndex:
            indexName: "idx_outbox_order_id"
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "order_id"
        - createIndex:
            indexName: "idx_outbox_created_at"
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "created_at"
        - createIndex:
            indexName: "idx_outbox_status_created"
            tableName: "t_outbox_events"
            columns:
              - column:
                  name: "status"
              - column:
                  name: "created_at"
        - addForeignKeyConstraint:
            baseTableName: "t_outbox_events"
            baseColumnNames: "order_id"
            referencedTableName: "t_order"
            referencedColumnNames: "id"
            constraintName: "fk_outbox_order"