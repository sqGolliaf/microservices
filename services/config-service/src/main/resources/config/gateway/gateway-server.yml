test:
  loaded: false
spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: license-service
              uri: lb://license-service
              predicates:
                - Path=/api/organization/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
server:
  port: 8072
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
management:
  endpoint:
    gateway:
      enabled: true
    env:
      enabled: true
      show-values: ALWAYS
  endpoints:
    web:
      exposure:
        include: health,info,gateway,env