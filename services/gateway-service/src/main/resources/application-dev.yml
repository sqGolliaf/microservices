spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/microservices
          jwk-set-uri: http://keycloak:9080/realms/microservices/protocol/openid-connect/certs

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/orders/**
  data:
    redis:
      host: localhost
      port: 6379

services:
  order-service:
    url: http://order-service:8080