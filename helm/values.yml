namespace: default

gateway:
  replicaCount: 1
  image:
    repository: sqgolliaf/gateway-service
    tag: latest
  port: 9090
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

order:
  replicaCount: 1
  image:
    repository: sqgolliaf/order-service
    tag: latest
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

user:
  replicaCount: 1
  image:
    repository: sqgolliaf/user-service
    tag: latest
  port: 8081


payment:
  replicaCount: 1
  image:
    repository: sqgolliaf/payment-service
    tag: latest
  port: 8082
